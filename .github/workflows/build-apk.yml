name: Build APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # needed to create releases
    env:
      # EAS expects these for expo prebuild, but we build locally
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      # fetch-depth: 0 so release notes can see prior tags and full history
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        run: |
          # GitHub's ubuntu-latest has Android SDK at /usr/local/lib/android/sdk
          # but the setup-android action tries to install the legacy 'tools' package
          # which no longer exists. Just accept licenses and ensure components.
          ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;27.3.13750724" >/dev/null
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Build release APK
        run: |
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stormready-apk
          path: StormReady-*.apk
          retention-days: 30

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: release-notes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE=""
          else
            RANGE="$PREV_TAG..HEAD"
          fi
          echo 'notes<<EOF' >> $GITHUB_OUTPUT
          if [ -n "$RANGE" ]; then
            git log --pretty=format:'- %s (%h)' $RANGE
          else
            git log --pretty=format:'- %s (%h)' -20
          fi
          echo ''
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Create release on tag push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: StormReady-*.apk
          generate_release_notes: false
          body: ${{ steps.release-notes.outputs.notes }}